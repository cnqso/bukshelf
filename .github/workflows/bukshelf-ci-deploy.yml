name: Bukshelf CI and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bukshelf-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Test the complete Bukshelf stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and vendors
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        run: pnpm --dir apps/readest-app exec playwright install --with-deps chromium

      - name: Type-check the Bun server
        run: pnpm --dir apps/bukshelf-server typecheck

      - name: Test the Bun server
        run: pnpm test:bukshelf

      - name: Lint and type-check the frontend
        run: pnpm --dir apps/readest-app lint

      - name: Test the frontend
        run: pnpm --dir apps/readest-app test -- --run

      - name: Test the unified development server
        run: pnpm test:e2e:bukshelf

      - name: Test the unified production server
        run: pnpm test:e2e:bukshelf:prod

      - name: Test Docker cold start and backup restore
        run: pnpm test:docker:bukshelf

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bukshelf-playwright-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/readest-app/playwright-report-bukshelf/
            apps/readest-app/playwright-report-bukshelf-prod/
            apps/readest-app/test-results/

  deploy:
    name: Deploy to books.cnqso.com
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://books.cnqso.com
    steps:
      - name: Configure the production SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.ASENDIO_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.ASENDIO_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/bukshelf-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/bukshelf-deploy ~/.ssh/known_hosts

      - name: Build and restart the production service
        env:
          DEPLOY_HOST: ${{ secrets.ASENDIO_HOST }}
          DEPLOY_USER: ${{ secrets.ASENDIO_USER }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/bukshelf-deploy -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_REVISION" <<'REMOTE'
          set -euo pipefail
          revision="$1"
          cd "$HOME/bukshelf"
          git fetch --no-tags origin "$revision"
          git switch --detach "$revision"
          git submodule update --init --recursive
          sudo docker compose --env-file .env --file docker/compose.yaml up --detach --build --remove-orphans

          deadline=$((SECONDS + 90))
          until curl --fail --silent --show-error http://127.0.0.1:43175/health >/dev/null; do
            if (( SECONDS >= deadline )); then
              sudo docker compose --env-file .env --file docker/compose.yaml ps
              sudo docker compose --env-file .env --file docker/compose.yaml logs --tail 100 bukshelf
              exit 1
            fi
            sleep 2
          done
          REMOTE

      - name: Verify the public endpoint
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 https://books.cnqso.com/health
