name: bukshelf

services:
  bukshelf:
    build:
      context: ..
      dockerfile: apps/bukshelf-server/Dockerfile
    image: ${BUKSHELF_IMAGE:-bukshelf:local}
    environment:
      BUKSHELF_HOST: 0.0.0.0
      BUKSHELF_PORT: 43175
      BUKSHELF_DATA_DIR: /data
      BUKSHELF_DATABASE_PATH: /data/bukshelf.sqlite
      BUKSHELF_AUTH_ENABLED: ${BUKSHELF_AUTH_ENABLED:-true}
      BUKSHELF_SECURE_COOKIES: ${BUKSHELF_SECURE_COOKIES:-false}
      BUKSHELF_SESSION_SECRET: ${BUKSHELF_SESSION_SECRET:-${JWT_SECRET:-}}
      SELF_HOSTED_BRAND_NAME: ${SELF_HOSTED_BRAND_NAME:-Bukshelf}
      SELF_HOSTED_PUBLIC_LIBRARY: ${SELF_HOSTED_PUBLIC_LIBRARY:-true}
      SITE_URL: ${SITE_URL:-http://localhost:43175}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:43175}
      BUKSHELF_API_PUBLIC_URL: ${BUKSHELF_API_PUBLIC_URL:-http://localhost:43175}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-google/gemini-3.6-flash}
      OPENROUTER_MAX_INPUT_CHARACTERS: ${OPENROUTER_MAX_INPUT_CHARACTERS:-900000}
      OPENROUTER_MAX_CONCURRENT: ${OPENROUTER_MAX_CONCURRENT:-2}
      OPENROUTER_REQUESTS_PER_MINUTE: ${OPENROUTER_REQUESTS_PER_MINUTE:-30}
      OPENROUTER_TOKENS_PER_DAY: ${OPENROUTER_TOKENS_PER_DAY:-5000000}
      OPENROUTER_MAX_OUTPUT_TOKENS: ${OPENROUTER_MAX_OUTPUT_TOKENS:-2048}
      SONIOX_API_KEY: ${SONIOX_API_KEY:-}
      SONIOX_TTS_MAX_CONCURRENT: ${SONIOX_TTS_MAX_CONCURRENT:-2}
      SONIOX_TTS_MAX_QUEUE_SIZE: ${SONIOX_TTS_MAX_QUEUE_SIZE:-32}
      SONIOX_TTS_REQUESTS_PER_MINUTE: ${SONIOX_TTS_REQUESTS_PER_MINUTE:-90}
      SONIOX_TTS_TOKENS_PER_MINUTE_PER_USER: ${SONIOX_TTS_TOKENS_PER_MINUTE_PER_USER:-20000}
      SONIOX_TTS_TOKENS_PER_DAY: ${SONIOX_TTS_TOKENS_PER_DAY:-500000}
    ports:
      - "127.0.0.1:${BUKSHELF_HOST_PORT:-43175}:43175"
    volumes:
      - bukshelf-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:43175/health'); process.exit(response.ok ? 0 : 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  bukshelf-data:
